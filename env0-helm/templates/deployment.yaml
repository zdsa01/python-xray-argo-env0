apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "python-xray-argo.fullname" . }}
  labels:
    app.kubernetes.io/name: {{ include "python-xray-argo.name" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "python-xray-argo.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "python-xray-argo.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
{{- with .Values.imagePullSecrets }}
      imagePullSecrets:
{{ toYaml . | indent 8 }}
{{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
          args:
            - |
              apt-get update
              apt-get install -y --no-install-recommends ca-certificates curl openssl procps
              rm -rf /var/lib/apt/lists/*
              python -m pip install --no-cache-dir --index-url {{ .Values.app.pipIndexUrl | quote }} -r /app/requirements.txt
              exec python -u /app/app.py
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          volumeMounts:
            - name: app
              mountPath: /app/app.py
              subPath: app.py
            - name: app
              mountPath: /app/requirements.txt
              subPath: requirements.txt
          env:
{{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
{{- end }}
{{- range $k, $v := .Values.secretEnv }}
            - name: {{ $k }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "python-xray-argo.fullname" $ }}-secrets
                  key: {{ $k }}
                  optional: true
{{- end }}
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            failureThreshold: 60
            periodSeconds: 5
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
{{ toYaml .Values.resources | indent 12 }}
      volumes:
        - name: app
          configMap:
            name: {{ include "python-xray-argo.fullname" . }}-app
